name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build With Maven
        run: mvn clean compile

  test-run:
    name: Test-Run
    runs-on: ubuntu-latest
    needs: build-run

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test

  artifacts-run:
    name: Artifacts-Run
    runs-on: ubuntu-latest
    needs: test-run

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package Application
        run: mvn package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifacts
          path: target/*.jar

  deploy-dev:
    name: Deploy-DEV
    runs-on: ubuntu-latest
    needs: artifacts-run
    environment: Dev

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifacts

      - name: Deploy to DEV
        run: echo "Deploying to DEV environment"