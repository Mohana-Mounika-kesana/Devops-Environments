name: Build-Workflow

on: 
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
      - feature/**
env:
  JAVA_VERSION: '17'
jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: set up java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with maven
        run: mvn clean compile